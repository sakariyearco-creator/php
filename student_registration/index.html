<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container my-5">

    <div class="card shadow-lg">

        <div class="card-header text-center">
            <h1>Student Registration Form</h1>
            <p class="mb-0">PHP & MySQL - Chapter 4 Assignment</p>
        </div>

        <div class="card-body p-4">

            <form action="process.php" method="POST" enctype="multipart/form-data">

                <!-- ================= PERSONAL INFORMATION ================= -->

                <h3 class="section-title">Personal Information</h3>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            id="name"
                            class="form-control"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Place of Birth (POB)
                        </label>

                        <input
                            type="text"
                            name="pob"
                            id="pob"
                            class="form-control"
                            placeholder="Enter place of birth"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            name="dob"
                            id="dob"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Address
                        </label>

                        <input
                            type="text"
                            name="address"
                            id="address"
                            class="form-control"
                            placeholder="Enter your address"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <div class="form-check">
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                                class="form-check-input"
                                required
                            >

                            <label class="form-check-label">
                                Male
                            </label>
                        </div>

                        <div class="form-check">
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                                class="form-check-input"
                            >

                            <label class="form-check-label">
                                Female
                            </label>
                        </div>

                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Telephone
                        </label>

                        <input
                            type="tel"
                            name="telephone"
                            id="telephone"
                            class="form-control"
                            placeholder="Enter telephone number"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            id="email"
                            class="form-control"
                            placeholder="example@email.com"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Student Image
                        </label>

                        <input
                            type="file"
                            name="image"
                            id="image"
                            class="form-control"
                            accept=".png,.jpg,.jpeg,.gif"
                            required
                        >

                        <small class="text-muted">
                            Allowed: PNG, JPG, JPEG, GIF
                        </small>
                    </div>

                </div>


                <!-- ================= PARENT INFORMATION ================= -->

                <h3 class="section-title mt-4">
                    Parent Information
                </h3>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Parent Name
                        </label>

                        <input
                            type="text"
                            name="parent_name"
                            id="parent_name"
                            class="form-control"
                            placeholder="Enter parent name"
                            required
                        >
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Parent Telephone
                        </label>

                        <input
                            type="tel"
                            name="parent_telephone"
                            id="parent_telephone"
                            class="form-control"
                            placeholder="Parent telephone"
                            required
                        >
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Relationship
                        </label>

                        <select
                            name="relationship"
                            id="relationship"
                            class="form-select"
                            required
                        >
                            <option value="">Select Relationship</option>
                            <option value="Father">Father</option>
                            <option value="Mother">Mother</option>
                            <option value="Guardian">Guardian</option>
                        </select>
                    </div>

                </div>


                <!-- ================= ACADEMIC INFORMATION ================= -->

                <h3 class="section-title mt-4">
                    Academic Information
                </h3>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Student ID
                        </label>

                        <input
                            type="text"
                            name="student_id"
                            id="student_id"
                            class="form-control"
                            placeholder="Enter student ID"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Faculty
                        </label>

                        <select
                            name="faculty"
                            id="faculty"
                            class="form-select"
                            required
                        >
                            <option value="">Select Faculty</option>

                            <option value="Computer and IT">
                                Computer and IT
                            </option>

                            <option value="Business Administration">
                                Business Administration
                            </option>

                            <option value="Economics">
                                Economics
                            </option>

                            <option value="Health Science">
                                Health Science
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Department
                        </label>

                        <input
                            type="text"
                            name="department"
                            id="department"
                            class="form-control"
                            placeholder="Enter department"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Class
                        </label>

                        <input
                            type="text"
                            name="class"
                            id="class"
                            class="form-control"
                            placeholder="Enter class"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Registration Date
                        </label>

                        <input
                            type="date"
                            name="registration_date"
                            id="registration_date"
                            class="form-control"
                            required
                        >
                    </div>

                </div>


                <!-- ================= BUTTONS ================= -->

                <div class="text-center mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg"
                    >
                        Register Student
                    </button>

                    <button
                        type="reset"
                        class="btn btn-secondary btn-lg"
                    >
                        Reset
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
